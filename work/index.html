    <style>
      html,
      body,
      #root {
        min-height: 100%;
        background: #0b1c17;
      }
      html body {
        background: #0b1c17;
      }
      #root {
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      html.app-ready #root {
        opacity: 1;
      }
      #root:empty {
        min-height: 100svh;
      }
      /* Keep the first paint dark while React and the page stylesheet load. */
      .sensor-hero {
        background: #000;
      }
      .sensor-hero .sensor-fallback {
        visibility: hidden;
        filter: saturate(0.72) brightness(0.55) contrast(1.15);
        mask-image: radial-gradient(
          ellipse at 52% 50%,
          black 18%,
          rgba(0, 0, 0, 0.84) 52%,
          transparent 78%
        );
        opacity: 0.68;
      }
      .sensor-hero .sensor-fallback.photo-ready {
        visibility: visible;
      }
      .sensor-hero .sensor-model,
      .sensor-hero model-viewer {
        display: none;
      }
    </style>
